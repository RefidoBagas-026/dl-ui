<template>
    <style>
        .bon-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            background-color: rgba(0,0,0,0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bon-popup-content {
            position: relative;
            background: #fff;
            padding: 20px 25px;
            border-radius: 10px;
            width: 36%;
            max-height: 80vh;
            overflow-y: auto;
            min-height: 500px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
            animation: popupFadeIn 0.25s ease-in-out;
        }

        @keyframes popupFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <div class="row">
        <div class="col-sm-12">

            <au-input-form title.bind="title" with.bind="context">
                <div class="alert alert-info" role="alert" if.bind="alertInfo" innerhtml.bind="alertInfo"></div>
                
                <au-textbox label="No Nota Penjualan" value.bind="data.noteNo" read-only="true"
                    options.bind="controlOptions" if.bind="readOnly || isEdit">
                </au-textbox>

                <au-autocomplete label="No Sales Contract Lokal" placeholder="Pilih No Sales Contract"
                    value.bind="selectedSalesContract" error.bind="error.salesContract"
                    loader.bind="salesContractLoader" text="salesContractNo" query.bind="filterSC"
                    read-only.bind="readOnly || isEdit" options.bind="controlOptions">
                </au-autocomplete>

                <au-datepicker label="Tgl Penjualan" value.bind="data.date" error.bind="error.date"
                    read-only.bind="readOnly" options.bind="controlOptions">
                </au-datepicker>

                <au-autocomplete label="Jenis Transaksi" placeholder="Pilih Jenis Transaksi"
                    value.bind="data.transactionType" error.bind="error.transactionType"
                    loader.bind="transactionTypeLoader" text.bind="transactionTypeView"
                    read-only.bind="true" options.bind="controlOptions">
                </au-autocomplete>

                <au-autocomplete label="Buyer" placeholder="Pilih Buyer" value.bind="data.buyer"
                    error.bind="error.buyer" loader.bind="buyerLoader" text.bind="buyerView"
                    read-only.bind="true" options.bind="controlOptions">
                </au-autocomplete>

                <au-autocomplete label="NIK Buyer" value.bind="data.buyer" text.bind="buyerNIKView" read-only="true"
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-autocomplete label="NPWP Buyer" value.bind="data.buyer" text.bind="buyerNPWPView" read-only="true"
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-autocomplete label="Status Buyer" value.bind="data.buyer" text.bind="buyerKaberView" read-only="true"
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-dropdown label="Jenis Pembayaran" value.bind="selectedPaymentType"
                    error.bind="error.paymentType" read-only.bind="readOnly"
                    items.bind="paymentTypeOptions" options.bind="controlOptions">
                </au-dropdown> 

                <div class="row" show.bind="data.paymentType=='TEMPO'">
                    <div class="col-sm-3">
                        <p class="form-control-static text-right">Tempo Pembayaran</p>
                    </div>
                    <div class="col-sm-3">
                        <au-numeric value.bind="data.tempo" error.bind="error.tempo" format="0"
                            read-only.bind="readOnly">
                        </au-numeric>
                    </div>
                    <p class="form-control-static">Hari</p>
                </div>

                <au-datepicker label="Tgl Jatuh Tempo" value.to-view="dueDate" error.bind="error.dueDate"
                    read-only="true" options.bind="controlOptions" show.bind="data.paymentType=='TEMPO'">
                </au-datepicker> 
                
                <div class="row" if.bind="useBonLoader">
                    <div class="col-sm-3">
                        <p class="form-control-static text-right">No Bon Keluar</p>
                    </div>
                        <div class="col-sm-2 mb-2" repeat.for="col of bonColumns">
                            <table class="table table-bordered table-striped">
                                <tbody>
                                    <tr repeat.for="bon of col">
                                        <td>${bon}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                   

                    <div class="col-sm-2" if.bind="!readOnly">
                        <button class="btn btn-primary w-100" click.delegate="openBonPopup()">+</button>
                    </div>
                     <div class="col-sm-4">
                        <p if.bind="error.expenditureNo" style="color:red; font-size: 0.85em; margin-top: 4px;">
                            ${error.expenditureNo}
                        </p>
                    </div>
                </div>

                <au-textbox 
                   if.bind="!useBonLoader" label="No Bon Keluar" placeholder="No Bon Keluar" value.bind="data.expenditureNo"
                   error.bind="error.expenditureNo" read-only.bind="readOnly" options.bind="controlOptions">
               </au-textbox>


                <!-- Popup Overlay untuk Pilih Bon LBL / LBM -->
                <div if.bind="showBonPopup" class="bon-popup-overlay" click.delegate="closeBonPopup($event)">
                    <div class="bon-popup-content" click.trigger.stop>
                        <h4 class="mb-3">Pilih Bon Keluar</h4>

                        <div class="row mb-2">
                            <div class="col-sm-10">
                                <au-autocomplete
                                    label="Cari Bon Keluar"
                                    placeholder="Cari Bon"
                                    value.bind="selectedBon"
                                    loader.bind="bonLoader"
                                    text.bind="bonView"
                                    options.bind="controlOptions">
                                </au-autocomplete>
                            </div>
                        </div>
                     
                        <table class="table table-bordered table-striped" if.bind="selectedBons.length > 0">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">No</th>
                                    <th style="width: 70%;">No Bon Keluar</th>
                                    <th style="width: 20%;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr repeat.for="bon of selectedBons">
                                    <td>${$index + 1}</td>
                                    <td>${bon.GarmentExpenditureWasteNo}</td>
                                    <td class="text-center">
                                        <button  class="btn btn-danger btn-sm" click.delegate="removeBon(bon)">Hapus</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="text-end mt-3">
                            <button class="btn btn-success me-2" click.delegate="saveSelectedBons()">Simpan</button>
                            <button class="btn btn-secondary" click.delegate="closeBonPopup()">Tutup</button>
                        </div>
                    </div>
                </div>

                <au-textbox label="No Disposisi" placeholder="No Disposisi" value.bind="data.dispositionNo"
                    error.bind="error.dispositionNo" read-only.bind="readOnly" options.bind="controlOptions">
                </au-textbox>

                <au-checkbox label="Apakah kena PPN ?" value.bind="data.useVat" error.bind="error.useVat"
                    read-only.bind="true"  change.delegate="selectedVatTaxChanged($event)" options.bind="controlOptions">
                </au-checkbox>

                <au-textbox 
                     error.bind="error.vatRate"
                     label="PPN"
                     value.bind="data.vat.rate"
                     placeholder="Vat Rate"
                     key=""
                     if.bind = "data.useVat"                     
                     read-only.bind="true"
                     options.bind="controlOptions">
                </au-textbox>

                <au-numeric label="Total Amount" value.to-view="total" error.bind="error.amount" read-only="true"
                    options.bind="controlOptions">
                </au-numeric>

                <au-autocomplete label="Bank Detail" value.bind="selectedAccountBank" error.bind="error.AccountBank"
                    read-only.bind="readOnly" loader.bind="accountBankLoader" text.bind="accountBankView"
                    key="BankName" placeholder="Cari Bank" query.bind="bankFilter" options.bind="controlOptions">
                </au-autocomplete>

                <au-multiline label="Keterangan" value.bind="data.remark" placeholder="Keterangan"
                    read-only.bind="readOnly" options.bind="controlOptions">
                </au-multiline>

                <au-textbox error.bind="error.itemsCount" read-only.bind="true" show.bind="error.itemsCount"
                    options.bind="controlOptions">
                </au-textbox>

                <au-collection columns.bind="items.columns" items.bind="data.items" errors.bind="error.items"
                    read-only.bind="readOnly || !data.transactionType"
                    options.bind="items.options"
                    item-template="modules/garment-shipping/local-sales-note/template/item">
                </au-collection>

                <au-numeric value.to-view="subtotal" read-only.bind="true" options.bind="controlOptions"
                    label="Sub Total">
                </au-numeric>
                <au-numeric value.to-view="ppn" read-only.bind="true" options.bind="controlOptions"
                    label="PPN">
                </au-numeric>
                <au-numeric value.to-view="total" read-only.bind="true" options.bind="controlOptions"
                    label="TOTAL">
                </au-numeric>

            </au-input-form>
        </div>
    </div>
</template>
