<template>
    <au-input-form title.bind="title" with.bind="context">
        <div class="row">
            <div class="col-md-12">
                    <au-textbox 
                        label="No DO" 
                        value.bind="data.ExportSalesDONo" 
                        read-only="true"
                        options.bind="controlOptions" 
                        if.bind="readOnly || data.id">
                </au-textbox>
                <au-datepicker 
                    label="Ex Factory Date" 
                    value.bind="data.ExFactoryDate" 
                    error.bind="error.ExFactoryDate"
                    read-only.bind="readOnly" 
                    options.bind="controlOptions">
                </au-datepicker>

                <au-autocomplete
                    value.bind="selectedBuyer"
                    error.bind="error.BuyerAgent"
                    label="Buyer Agent"
                    loader.bind="buyerLoader"
                    query.bind="buyerQuery"
                    text.bind = "buyerView"
                    placeholder="cari buyer"
                    read-only.bind="readOnly || isEdit"
                    options.bind="controlOptions">
                </au-autocomplete>

                <au-dropdown 
                label="Shipment" 
                value.bind="data.Shipment" 
                error.bind="error.Shipment"
                read-only.bind="readOnly"
                options.bind="controlOptions" 
                items.bind="ShipmentItems">
                </au-dropdown>

                <au-textbox 
                    label="Final Destination" 
                    value.bind="data.FinalDestination" 
                    error.bind="error.FinalDestination" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions" >
                </au-textbox>

                <div show.bind="selectedBuyer">
                    <button show.bind="(!isEdit && !readOnly)" class="btn btn-primary" click.delegate="downloadExcelTemplate()">
                        Download Template
                    </button>
                    <div class="row" show.bind="isCreate">
                        <div class="col-md-12">
                            <div class="${error.file ? 'has-error':''}">
                                <label for="dataFile" class="col-sm-4 control-label">File Path</label>
                                <div class="col-sm-4">
                                    <input class="btn btn-default" 
                                        type="file" 
                                        id="fileCsv" 
                                        name="fileUpload"  
                                        accept=".xls,.xlsx,.csv"
                                        change.delegate="handleFileUpload($event)">
                                    <span class="help-block">${error.file}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group has-error">
                    <p if.bind="error.ItemsCount" class="help-block text-center">${error.ItemsCount}</p>
                </div>

                    read-only.bind="readOnly" 
                    options.bind="Options"
                    item-template="modules/garment-shipping/export-sales-do-upload/template/item">
                </au-collection>
            </div>
