<template>
  <require from="../../../lib/number-format-value-converter.js"></require>
  <require from="../../../lib/date-format-value-converter.js"></require>

  <au-input-form 
      title.bind="title" 
      with.bind="context" 
      options.bind="formOptions" 
      edit.call="editCallback($event)" 
      delete.call="deleteCallback($event)">
    
    <div class="row">
      <div class="col-md-6">
         <au-textbox label="No"
                value.bind="data.no"
                error.bind="error.no"
                read-only.bind="true"
                if.bind="(readOnly || isEdit)"
                options.bind="controlOptions">
    </au-textbox>
    
    <au-textbox label="Unit"
                value.bind="data.unit.division.name + ' - ' + data.unit.name"
                error.bind="error.unit"
                read-only.bind="true"
                if.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

    <au-datepicker label="Tgl. Order"
                   value.bind="data.orderDate"
                   error.bind="error.orderDate"
                   read-only.bind="(readOnly || isEdit)"
                   options.bind="controlOptions">
    </au-datepicker>
    <au-datepicker label="Tgl. Delivery"
                   value.bind="data.deliveryDate"
                   error.bind="error.deliveryDate"
                   read-only.bind="readOnly"
                   options.bind="controlOptions">
    </au-datepicker>

    
    <au-textbox label="Ongkos Kirim Ditanggung oleh"
                value.bind="data.freightCostBy"
                error.bind="error.freightCostBy"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>
    
     <au-textbox label="Term Pembayaran"
                value.bind="data.paymentMethod"
                error.bind="error.paymentMethod"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

     <au-textbox label="Jenis PO Cash"
                value.bind="data.poCashType"
                error.bind="error.poCashType"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

    <au-textbox label="Supplier"
                value.bind="data.supplier.code + ' - ' + data.supplier.name"
                error.bind="error.supplier"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

   
    <au-textbox label="Mata Uang"
                value.bind="data.currency.code"
                error.bind="error.currency"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

    <au-textbox label="Rate"
                value.bind="data.currency.rate"
                error.bind="error.currency.rate"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

    <au-textbox label="Tempo Pembayaran"
                value.bind="data.paymentDueDays"
                error.bind="error.paymentDueDays"
                format="0"
                read-only.bind="readOnly"
                post-fix="hari"
                if.bind="data.paymentMethod=='CASH'"
                options.bind="controlOptions">
    </au-textbox>

    <au-textbox label="Pph"
                value.bind="data.incomeTax.name + ' - ' + data.incomeTax.rate"
                error.bind="error.incomeTax.name"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

    <au-textbox label="Rate Pph"
                value.bind="data.incomeTax.rate"
                error.bind="error.incomeTax.rate"
                read-only.bind="readOnly"
                post-fix="%"
                options.bind="controlOptions">
    </au-textbox>

    <au-textbox label="PPH Ditanggung oleh"
                 value.bind="data.incomeTaxBy"
                 error.bind="error.incomeTaxBy"
                 read-only.bind="readOnly"
                 show.bind="data.useIncomeTax"
                 items.bind="IncomeTaxByOptions"
                 options.bind="controlOptions">
    </au-textbox>

    <au-checkbox label="Apakah kena Ppn?"
                 value.bind="data.useVat"
                 error.bind="error.useVat"
                 read-only.bind="readOnly"
                 change.delegate="useVatChanged($event)"
                 options.bind="controlOptions">
    </au-checkbox>
  
     <au-textbox label="PPN"
                value.bind="data.vatTax.rate"
                error.bind="error.vatTax.rate"
                if.bind = "data.useVat"
                read-only.bind="readOnly"
                options.bind="controlOptions">
    </au-textbox>

    <au-multiline label="Keterangan"
                  value.bind="data.remark"
                  placeholder="tambah keterangan"
                  read-only.bind="readOnly"
                  options.bind="controlOptions">
    </au-multiline>

    <au-multiline label="Alasan Pengurangan Harga"
                    value.bind="data.priceReductionReason"
                    error.bind="error.priceReductionReason"
                    placeholder="tambah alasan pengurangan harga"
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
    </au-multiline>
      </div>
    </div>

    <au-textbox show.bind="error.itemscount"
                error.bind="error.itemscount"
                read-only="true">
    </au-textbox>

    <au-collection items.bind="data.items"
                   errors.bind="error.items"
                   columns.bind="itemsColumns"
                   options.bind="options"
                   read-only.bind="readOnly"
                   item-template="modules/purchasing/purchase-order-external-approval/template/purchase-order-external-item">
    </au-collection>
    
  </au-input-form>
</template>
