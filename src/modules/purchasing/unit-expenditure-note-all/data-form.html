<template>
    <au-input-form 
        title.bind="title" 
        with.bind="context">

        <div slot="actions" class="btn-group">
            <button type="button" class="btn btn-default" click.delegate="context.cancel($event)"     if.one-way="context.hasCancel">Kembali</button>
            <button type="button" class="btn btn-primary" click.delegate="context.edit($event)"    if.bind="context.hasEdit && canEditOrDelete()">Ubah</button>
            <button type="button" class="btn btn-success" click.delegate="context.save($event)"       if.one-way="context.hasSave">Simpan</button>
            <button type="button" class="btn btn-danger"  click.delegate="context.delete($event)"   if.bind="context.hasDelete && canEditOrDelete()">Hapus</button>
        </div>

        <div class="row">
            <div class="col-md-6">
                <au-textbox 
                    label=""
                    read-only.bind="true"
                    options.bind="controlOptions">
                </au-textbox>
                
                <au-textbox 
                    label="Nomor Bon Pengeluaran Unit" 
                    value.bind="data.UENNo" 
                    error.bind="error.UENNo" 
                    read-only.bind="true"
                    if.bind="(readOnly || isEdit)"
                    options.bind="controlOptions">
                </au-textbox>

                <au-datepicker 
                    label="Tgl. Pengeluaran" 
                    value.bind="data.ExpenditureDate" 
                    error.bind="error.ExpenditureDate" 
                    read-only.bind="readOnly || isEdit"
                    options.bind="controlOptions">
                </au-datepicker>

                <au-textbox
                    label="Nama Penerima Barang"
                    value.bind="data.ReceiptName"
                    error.bind="error.ReceiptName"
                    read-only.bind="readOnly || isEdit" 
                    options.bind="controlOptions">
                </au-textbox>
                <au-textbox
                    label="Bagian Penerima"
                    value.bind="data.UnitReceipt"
                    error.bind="error.UnitReceipt"
                    read-only.bind="readOnly || isEdit" 
                    options.bind="controlOptions">
                </au-textbox>
                <au-autocomplete 
                    value.bind="unit"
                    label="Diambil Dari" 
                    query.bind="unitQuery"
                    loader.one-time="unitLoader" 
                    text.bind="unitView"
                    read-only.bind="readOnly  || isEdit"
                    error.bind="error.unitId"
                    options.bind="controlOptions">
                </au-autocomplete>
                 <au-textbox
                    label="Keterangan"
                    value.bind="data.Remark"
                    error.bind="error.Remark"
                    read-only.bind="readOnly || isEdit" 
                    options.bind="controlOptions">
                </au-textbox>
               
            </div>
    </div>

        <au-textbox error.bind="error.ItemsCount" read-only.bind="true"></au-textbox>

        <au-collection 
            items.bind="data.Items" 
            errors.bind="error.Items"
            columns.bind="items.columns"
            options.bind="options"
            read-only.bind="readOnly" 
            show.bind="isItem"
            add.bind="addItems"
            header-template="modules/purchasing/unit-expenditure-note-by-user/template/unit-expenditure-note-item-header"
            item-template="modules/purchasing/unit-expenditure-note-by-user/template/unit-expenditure-note-item">
        </au-collection>
  </au-input-form>
</template>
