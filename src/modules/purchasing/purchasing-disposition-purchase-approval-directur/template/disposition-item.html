<template >
    <tr>
         <td>
            <au-textbox 
                value.bind="data.supplierName" 
                read-only.bind="true"
                error.bind="error.supplierName"
                >
            </au-textbox>
        </td>
        <td  class="col-sm-3">
            <au-autocomplete 
                    value.bind="dataProduct" 
                    error.bind="error.product"
                    loader.bind="productLoader"
                    placeholder="cari barang" 
                    key="code"
                    query.bind="isPostedQuery"
                    read-only.bind="true">
                </au-autocomplete>
        </td>
        <td>
            <au-textbox 
                value.bind="data.brandName" 
                read-only.bind="true"
                error.bind="error.brandName">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.description" 
                read-only.bind="true"
                error.bind="error.description">
            </au-textbox>
        </td>
        <td>
            <au-autocomplete 
                value.bind="dataCurrency" 
                error.bind="error.currency"
                loader.bind="currencyLoader"
                placeholder="cari mata uang" 
                text="code"
                key="Id"
                read-only.bind="true">
            </au-autocomplete>
        </td>
         <td>
            <au-numeric 
                value.bind="data.quantity"
                read-only.bind="true"
                error.bind="error.quantity"
                input.delegate="options.calculateTotalPrice(data)">
            </au-numeric>
        </td>
         <td>
            <au-textbox 
                value.bind="data.product.uom.unit" 
                read-only.bind="true"
                error.bind="error.uom">
            </au-textbox>
        </td>
        <td>
            <au-numeric 
                value.bind="data.product.price"
                read-only.bind="true" 
                error.bind="error.productPrice"
                input.delegate="options.calculateTotalPrice(data)">
            </au-numeric>
        </td>
        <td>
            <au-numeric 
                value.bind="data.totalPrice"
                read-only.bind="true"
                error.bind="error.totalPrice">
            </au-numeric>
        </td>
    </tr>
</template>
