<template>
  <au-input-form title="Detail Invoice" with.bind="context">
    <!-- <au-textbox label="ID" value.bind="data.Id" read-only="true" options.bind="controlOptions"></au-textbox>
    <au-textbox label="Invoice No" value.bind="data.invoiceNo" read-only="true" options.bind="controlOptions"></au-textbox> -->
    <!-- Side-by-side comparisons -->
    <au-comparison 
      label="Nama Invoice" 
      value1.bind="data.invoiceNo" 
      value2.bind="data.invoiceNoScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="Tanggal Invoice" 
      value1.bind="data.invoiceDate" 
      value2.bind="data.invoiceDateScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      format="date"
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="Tanggal Faktur Pajak" 
      value1.bind="data.fakturPajakDate" 
      value2.bind="data.fakturPajakDateScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      format="date"
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="No. Faktur Pajak" 
      value1.bind="data.fakturPajak" 
      value2.bind="data.fakturPajakScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="Mata Uang" 
      value1.bind="data.currencyCode" 
      value2.bind="data.currencyCodeScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="DPP" 
      value1.bind="data.lineAmountSum" 
      value2.bind="data.lineAmountSumScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      format="0.00"
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="Nilai PPN" 
      value1.bind="data.PPNValue" 
      value2.bind="data.PPNValueScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      format="0.00"
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="Nilai PPH" 
      value1.bind="data.PPHValue" 
      value2.bind="data.PPHValueScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      format="0.00"
      use-absolute.bind="true"
      options.bind="controlOptions">
    </au-comparison>
    
    <au-comparison 
      label="Grand Total" 
      value1.bind="data.totalInvoiceSum" 
      value2.bind="data.totalInvoiceSumScanResult" 
      label1="Data 365" 
      label2="Data Hasil Scan" 
      format="0.00"
      options.bind="controlOptions">
    </au-comparison>

    <!-- Tabel khusus invoiceNo dan tombol 'i' -->
    <au-table
      data.bind="[data]"
      columns.bind="[ { field: 'invoiceNo', title: 'Nomor Invoice' }, { field: 'actions', title: '', formatter: actionFormatter } ]"
      options.bind="tableOptions"
      view-model.ref="specialTable">
    </au-table>

    <!-- Tabel items invoice, muncul saat tombol 'i' diklik -->
    <au-collection
      if.bind="showItemsTable"
      items.bind="itemsData"
      columns.bind="itemsColumns"
      read-only="true"
      options.bind="{ control: { length: 12 } }">
    </au-collection>

    <!-- Tabel Nomor PO, selalu tampil -->
<au-table
  data.bind="data.purchaseOrders"
  columns.bind="poColumns"
  options.bind="poTableOptions"
  view-model.ref="poTable">
</au-table>

<!-- Tabel Surat Jalan, selalu tampil -->
<au-table
  data.bind="data.productReceipts"
  columns.bind="sjColumns"
  options.bind="sjTableOptions"
  view-model.ref="sjTable"
  style="margin-bottom:24px;">
</au-table>

    <div style="height: 56px;"></div>
    <div slot="actions" class="btn-group">
      <button class="btn btn-default" click.delegate="cancel($event)" if.one-way="hasCancel">Kembali</button>
    </div>
  </au-input-form>
</template>
