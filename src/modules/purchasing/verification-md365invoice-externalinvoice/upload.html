<template>
  <div class="upload-section">
    <input type="file" accept="application/pdf" files.bind="files" multiple>
    <button class="btn btn-success" click.delegate="uploadFiles()">Upload</button>
    <div if.bind="uploadedFiles && uploadedFiles.length">
      <h4>File Terupload:</h4>
      <ul>
        <li repeat.for="file of uploadedFiles">${file.name}</li>
      </ul>
    </div>
  </div>
</template>
