<template>
    <au-input-form 
        title.bind="title" 
        with.bind="context">

        <div class="row">
            <div class="col-md-6">
                <au-textbox 
                    label=""
                    read-only.bind="true"
                    options.bind="controlOptions">
                </au-textbox>
                
                <au-textbox 
                    label="Nomor Disposisi" 
                    value.bind="data.DispositionNo" 
                    error.bind="error.DispositionNo" 
                    read-only.bind="true"
                    if.bind="(readOnly || isEdit)"
                    options.bind="controlOptions">
                </au-textbox>
                
                <au-datepicker 
                    label="Tgl. Disposisi" 
                    value.bind="data.DispositionDate" 
                    error.bind="error.DispositionDate" 
                    read-only.bind="readOnly"
                    options.bind="controlOptions">
                </au-datepicker>
                 <au-textbox
                    label="Keterangan"
                    value.bind="data.Remark"
                    error.bind="error.Remark"
                    read-only.bind="readOnly" 
                    options.bind="controlOptions">
                </au-textbox>
                <au-textbox
                    label="Pimpinan 1"
                    value.bind="data.ApprovedUnit1By"
                    error.bind="error.ApprovedUnit1By"
                    read-only.bind="readOnly" 
                    options.bind="controlOptions">
                </au-textbox>
                <au-textbox
                    label="Pimpinan 2"
                    value.bind="data.ApprovedUnit2By"
                    error.bind="error.ApprovedUnit2By"
                    read-only.bind="readOnly" 
                    options.bind="controlOptions">
                </au-textbox>
            </div>
    </div>

        <au-textbox error.bind="error.ItemsCount" read-only.bind="true"></au-textbox>

        <au-collection 
            items.bind="data.Items" 
            errors.bind="error.Items"
            columns.bind="items.columns"
            options.bind="options"
            read-only.bind="readOnly" 
            if.bind="isItem"
            header-template="modules/purchasing/purchasing-disposition-unit/template/disposition-purchase-header"
            item-template="modules/purchasing/purchasing-disposition-unit/template/disposition-purchase-item">
        </au-collection>
    
        <div slot="actions" class="btn-group">
            <button type="button" class="btn btn-default" click.delegate="context.cancel($event)"     if.one-way="context.hasCancel">Kembali</button>
       </div>
  </au-input-form>
</template>
