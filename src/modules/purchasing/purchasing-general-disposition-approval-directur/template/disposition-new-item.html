<template >
    <tr>
         <td>
            <au-textbox 
                value.bind="data.ProductCode"
                read-only.bind="true"
                error.bind="error.ProductCode">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.ProductName"
                read-only.bind="true"
                error.bind="error.ProductName">
            </au-textbox>
        </td>
        <td>
            <au-autocomplete 
                value.bind="dataUom" 
                error.bind="error.Uom"
                loader.bind="uomLoader"
                placeholder="cari satuan" 
                text="Unit"
                key="Id"
                read-only.bind="true">
            </au-autocomplete>
        </td>
        <td>
            <au-autocomplete 
                value.bind="dataCurrency" 
                error.bind="error.ProductCurrency"
                loader.bind="currencyLoader"
                placeholder="cari mata uang" 
                text="code"
                key="Id"
                read-only.bind="true">
            </au-autocomplete>
        </td>
        
        <td>
            <au-numeric 
                value.bind="data.ProductPrice"
                read-only.bind="true"
                error.bind="error.ProductPrice">
            </au-numeric>
        </td>
        <td>
            <au-textbox 
                value.bind="data.SupplierName1"
                read-only.bind="true"
                error.bind="error.SupplierName1">
            </au-textbox>
        </td>
        <td>
            <au-numeric 
                value.bind="data.SupplierPrice1"
                read-only.bind="true"

        <td>

        </td>
        <td>
            <au-numeric 
                value.bind="data.SupplierPrice2"
                read-only.bind="true"
                error.bind="error.SupplierPrice2">
            </au-numeric>
        </td>
        <td>
            <au-textbox 
                value.bind="data.SupplierName3"
                read-only.bind="true"
                error.bind="error.SupplierName3">
            </au-textbox>
        </td>
        <td>
            <au-numeric 
                value.bind="data.SupplierPrice3"
                read-only.bind="true"
                error.bind="error.SupplierPrice3">
            </au-numeric>
        </td>
        
    </tr>
</tr>
</template>
