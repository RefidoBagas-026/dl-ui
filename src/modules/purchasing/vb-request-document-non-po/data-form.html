<template>
  <require from="./card-template/card-content"></require>
  <au-input-form title.bind="title"
                 with.bind="context"
                 options.bind="formOptions">

    <au-datepicker value.bind="data.Date"
                   error.bind="error.Date"
                   show.bind="isVisible"
                   read-only.bind="readOnly"
                   label="Tanggal"
                   options.bind="controlOptions">
    </au-datepicker>

    <au-datepicker value.bind="data.RealizationEstimationDate"
                   error.bind="error.RealizationEstimationDate"
                   read-only.bind="readOnly"
                   label="Tanggal Estimasi Realisasi"
                   options.bind="controlOptions">
    </au-datepicker>

    <au-autocomplete value.bind="data.SuppliantUnit"
                     error.bind="error.SuppliantUnit"
                     label="Unit Pemohon"
                     loader.one-time="unitLoader"
                     text.bind="unitView"
                     query.bind="unitsQuery"
                     read-only.bind="readOnly || isEdit"
                     options.bind="controlOptions">
    </au-autocomplete>

    <au-autocomplete placeholder="pilih mata uang"
                     value.bind="data.Currency"
                     error.bind="error.Currency"
                     loader.bind="currencyLoader"
                     label="Mata Uang"
                     text.bind="currencyView"
                     read-only.bind="readOnly"
                     options.bind="controlOptions">
    </au-autocomplete>

    <au-numeric label="Jumlah Uang"
                value.bind="data.Amount"
                error.bind="error.Amount"
                read-only.bind="readOnly"
                format="0,0.00"
                options.bind="controlOptions">
    </au-numeric>

    <au-multiline label="Kegunaan"
                  value.bind="data.Purpose"
                  error.bind="error.Purpose"
                  placeholder="Kegunaan"
                  read-only.bind="readOnly"
                  options.bind="controlOptions">
    </au-multiline>

    <au-checkbox label="Inklaring"
                 value.bind="data.IsInklaring"
                 placeholder="inklaring"
                 read-only.bind="readOnly"
                 options.bind="controlOptions">
    </au-checkbox>

    <div show.bind="data.IsInklaring">
      <au-textbox value.bind="data.NoBL" read-only.bind="readOnly" error.bind="error.NoBL" label="No. BL / AWB"
        options.bind="controlOptions">
      </au-textbox>
      <au-textbox value.bind="data.NoPO" read-only.bind="readOnly" error.bind="error.NoPO" label="No. Kontrak / PO"
        options.bind="controlOptions">
      </au-textbox>
    </div>

    <au-checkbox label="Claim"
                 value.bind="data.IsClaim"
                 placeholder="claim"
                 read-only.bind="readOnly"
                 options.bind="controlOptions">
    </au-checkbox>

    <au-textbox value.bind="data.ClaimType" read-only.bind="readOnly" error.bind="error.ClaimType" label="Jenis Claim"
    options.bind="controlOptions" show.bind = "data.IsClaim">
    </au-textbox>

    <!-- <au-multiline label="Jenis Claim"
                    value.bind="data.ClaimType"
                    read-only.bind="readOnly"
                    options.bind="controlOptions"
                    show.bind = "data.IsClaim">
      </au-multiline> -->
    <!-- <card-content data.bind="data">
    
    </card-content> -->
    <div class="container">
      <au-textbox show.bind="data.Currency && error.Item"
                  read-only.bind="true"
                  value.bind="error.Item"
                  style="color: red;"></au-textbox>
      <!-- <table show.bind="data.Currency">
        <tr repeat.for="cardContents of cards">
          <td repeat.for="cardContent of cardContents">
             
            <au-checkbox if.bind="cardContent.Unit.VBDocumentLayoutOrder != 10"
                         label.bind="cardContent.Unit.Name"
                         value.bind="cardContent.IsSelected"
                         error.bind="error.cardContent"
                         read-only.bind="readOnly"
                         options.bind="controlOptionsLabel">
            </au-checkbox>
            <au-checkbox if.bind="cardContent.Unit.VBDocumentLayoutOrder == 10 && !readOnly"
                         value.bind="cardContent.IsSelected"
                         change.delegate="otherUnitSelected($event,cardContent)"
                         error.bind="error.cardContent"
                         read-only.bind="readOnly"
                         options.bind="controlOptionsLabel">
            </au-checkbox>
            <au-checkbox if.bind="cardContent.Unit.VBDocumentLayoutOrder == 10 && readOnly"
                         label.bind="cardContent.Unit.Name"
                         value.bind="cardContent.IsSelected"
                         error.bind="error.cardContent"
                         read-only.bind="readOnly"
                         options.bind="controlOptionsLabel">
            </au-checkbox>
            <au-autocomplete if.bind="cardContent.IsSelected && cardContent.Unit.VBDocumentLayoutOrder == 10 && !readOnly "
                             value.bind="cardContentUnit"
                             read-only.bind="readOnly"
                             loader.bind="unitVBNonPOLoader"
                             query.bind="unitQuery"
                             text="Name"
                             options.bind="controlOptionsDetail">
            </au-autocomplete>
          </td>
        </tr>
      </table> -->
      <au-collection items.bind="data.Items"
                     errors.bind="error.Items"
                     columns.bind="itemColumns"
                     add.bind="addItems"
                     remove.bind="onremoveItems"
                     read-only.bind="readOnly"
                     options.bind="itemOptions"
                     show.bind="data.Currency"
                     item-template="modules/purchasing/vb-request-document-non-po/card-template/card-content">
      </au-collection>

      <au-textbox error.bind="error.CompareNominalDisposisi"
                  show.bind="error.CompareNominalDisposisi"
                  read-only.bind="true"
                  style="color: red">
      </au-textbox>
      <au-textbox read-only.bind="true"
                  show.bind="error.DocumentFile"
                  value.bind="error.DocumentFile"
                  style="color: red">
      </au-textbox>

      <div class="row" errors.bind="error.DocumentFile" show.bind="data.Currency && data.IsClaim">
        <div class="col-md-6">
          <h4>File Dokumen</h4>
          <table class="table table-hover table-bordered">
            <thead>
              <th class="col-md-4">File</th>
              <th class="col-md-4">Amount</th>
              <th if.bind="!readOnly" class="col-md-1">
                <button click.delegate="onAddDocument()" class="btn btn-success pull-right">+</button>
              </th>
            </thead>
            <tbody>
              <tr if.bind="!data.DocumentsFileName || data.DocumentsFileName.length < 1">
                <td colspan="3">
                  Tidak ada file
                </td>
              </tr>
              <tr if.bind="data.DocumentsFileName" repeat.for="doc of data.DocumentsFileName">
                <td if.bind="readOnly">
                  <button class="btn btn-primary justify-content-center"
                    click.delegate="downloadDocument($index)">${doc.documentName}</button>
                </td>
                <td if.bind="!readOnly">
                  <input if.bind="!documentsPathTemp[$index]" type="file" id="documentInput${$index}"
                    value.bind="documentUpload" change.delegate="documentInputChanged($index)"
                    accept=".pdf, .xls, .xlsx, .doc, .docx">
                  <button if.bind="documentsPathTemp[$index]" class="btn btn-primary justify-content-center"
                    click.delegate="downloadDocument($index)">${doc.documentName}</button>
                  <span class="text-danger" if.bind="error.DocumentsFile[$index]">${error.DocumentsFile[$index]}</span>
                </td>
                <td if.bind="!readOnly">
                  <!-- <au-numeric 
                    value.bind="data.Amount"
                    read-only.bind="readOnly"
                    error.bind="error.Amount"
                    format="0,0.00"
                    options.bind="controlOptions">
                  </au-numeric> -->
                  <!-- <input type="number"  read-only.bind="readOnly" id="amount${$index}" value.bind ="doc.amount" change.delegate="amountInputChanged($index)"> -->
                  <input type="text" id="amount${$index}" value.bind="doc.amount" change.delegate="amountInputChanged($index)" input.delegate="formatNumber($event, $index)">
                  
                </td>

                <td if.bind="readOnly">
                  <!-- <au-numeric 
                    value.bind="data.Amount"
                    read-only.bind="readOnly"
                    error.bind="error.Amount"
                    format="0,0.00"
                    options.bind="controlOptions">
                  </au-numeric> -->
                  <input type="number"  read-only.bind="readOnly" id="amount${$index}" value.bind ="doc.amount" change.delegate="amountInputChanged($index)" disabled>
                </td>
                <td if.bind="!readOnly">
                  <button class="btn btn-danger pull-right" click.delegate="onRemoveDocument($index)">-</button>
                </td>
                
              </tr>
            </tbody>
          </table>
        </div>
  
      </div>
    </div>

  </au-input-form>
</template>
