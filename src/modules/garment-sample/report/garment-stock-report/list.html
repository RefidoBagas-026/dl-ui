<template>
    <h1 if.bind="KtgrItem == ''" class="page-header">LAPORAN STOCK GUDANG SAMPLE</h1>
    <h1 if.bind="KtgrItem == 'BAHAN BAKU'" class="page-header">LAPORAN STOCK BAHAN BAKU</h1>
    <h1 if.bind="KtgrItem == 'BAHAN EMBALANCE'" class="page-header">LAPORAN STOCK BAHAN EMBALANCE</h1>
    <h1 if.bind="KtgrItem == 'BAHAN PENDUKUNG'" class="page-header">LAPORAN STOCK BAHAN PENDUKUNG</h1>
    <form class="form-horizontal">
        <au-autocomplete label="Unit" value.bind="selectedUnit" read-only.bind="true" options.bind="controlOptions"
            loader.bind="unitLoader" text.bind="unitView" placeholder="Unit">
        </au-autocomplete>
        <au-dropdown label="Kategori" value.bind="KtgrItem" items.bind="KategoriItems" options.bind="controlOptions">
        </au-dropdown>
        <au-datepicker label="Tanggal Awal" value.bind="dateFrom" options.bind="controlOptions"></au-datepicker>
        <au-datepicker label="Tanggal Akhir" value.bind="dateTo" options.bind="controlOptions"></au-datepicker>
        <div class="form-group">
            <label for="contact" class="col-sm-5 control-label"></label>
            <div class="col-sm-3">
                <button click.delegate="searching()" class='btn btn-success'>Cari Data</button>
                <button click.delegate="reset()" class='btn btn-success'>Reset Data</button>
            </div>
        </div>
        <div slot="toolbar" class="btn-group">
            <button class='btn btn-primary' click.delegate="ExportToExcel()">Export To Excel</button>
        </div>
        <br>

        <div class="table-responsive">
            <table class="table table-bordered table-hover" border="1" id="poReport">
                <thead align="center">
                    <tr>
                        <td align="center" rowspan="2">NO</td>
                        <td align="center" rowspan="2">KODE</td>
                        <td align="center" rowspan="2">NO RO</td>
                        <td align="center" rowspan="2">PLANPO</td>
                        <td align="center" rowspan="2">NO ARTIKEL</td>
                        <td align="center" rowspan="2">NAMA BARANG</td>
                        <td align="center" rowspan="2">BUYER</td>
                        <td align="center" colspan="2">SALDO AWAL</td>
                        <td colspan="6">P E M A S U K A N</td>
                        <td colspan="5">P E N G E L U A R A N</td>
                        <td align="center" rowspan="2">SALDO AKHIR</td>
                        <td align="center" rowspan="2">ASAL</td>
                    </tr>
                    <tr>
                        <td>JUMLAH</td>
                        <td>SATUAN</td>
                        <td>KOREKSI</td>
                        <td>PEMBELIAN</td>
                        <td>PROSES</td>
                        <td>SUBCON</td>
                        <td>SISA</td>
                        <td>GARMENT</td>
                        <td>RETUR</td>
                        <td>SISA</td>
                        <td>PROSES</td>
                        <td>GARMENT</td>
                        <td>SUBCON</td>
                    </tr>

                </thead>
                <tbody>
                    <tr repeat.for="item of data">
                        <td>${$index + 1}</td>
                        <td>${item.ProductCode}</td>
                        <td>${item.RO}</td>
                        <td>${item.PlanPo}</td>
                        <td>${item.NoArticle}</td>
                        <td>${item.ProductName}</td>
                        <td>${item.Buyer}</td>
                        <td>${item.BeginningBalanceQty}</td>
                        <td>${item.BeginningBalanceUom}</td>
                        <!-- <td>${item.BeginningBalancePrice}</td> -->
                        <td>${item.ReceiptCorrectionQty}</td>
                        <!-- <td>${item.ReceiptCorrectionPrice}</td> -->
                        <td>${item.ReceiptPurchaseQty }</td>
                        <!-- <td>${item.ReceiptPurchasePrice}</td> -->
                        <td>${item.ReceiptProcessQty}</td>
                        <!-- <td>${item.ReceiptProcessPrice}</td> -->
                        <td>${item.ReceiptSubconQty}</td>
                        <!-- <td>${item.ReceiptSubconPrice}</td> -->
                        <td>${item.ReceiptRestQty}</td>
                        <!-- <td>${item.ReceiptRestPrice}</td> -->
                        <td>${item.ReceiptSampleQty}</td>
                        <!-- <td>${item.ReceiptSamplePrice}</td> -->
                        <td>${item.ExpendReturQty}</td>
                        <!-- <td>${item.ExpendReturPrice}</td> -->
                        <td>${item.ExpendRestQty}</td>
                        <!-- <td>${item.ExpendRestPrice}</td> -->
                        <td>${item.ExpendSampleQty}</td>
                        <!-- <td>${item.ExpendProcessPrice}</td> -->
                        <td>${item.ExpendGarmentQty}</td>
                        <!-- <td>${item.ExpendSamplePrice}</td> -->
                        <td>${item.ExpendSubconQty}</td>
                        <!-- <td>${item.ExpendSubconPrice}</td> -->
                        <td align="right">${item.EndingBalanceQty}</td>
                        <!-- <td align="right">${item.EndingBalancePrice}</td> -->
                        <td>${item.PaymentMethod}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="alert alert-info text-center" role="alert" if.bind="data.length === 0">
            Tidak ada data.
        </div>
        <pagination if.bind="info.total>info.size" info.bind="info" change.delegate="changePage($event)"></pagination>
        <hr />
    </form>


</template>
