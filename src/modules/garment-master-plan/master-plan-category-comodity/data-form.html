<template>
    <au-input-form
        title.bind="title"
        with.bind="context">
        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)" if.one-way="context.hasCancel">Kembali</button>
            <button if.bind ="!data.IsUse" class="btn btn-primary" click.delegate="context.edit($event)" if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)" if.one-way="context.hasSave">Simpan</button>
            <button if.bind ="!data.IsUse" class="btn btn-danger" click.delegate="context.delete($event)" if.one-way="context.hasDelete">Hapus</button>
        </div>

        <au-textbox
            if.bind = "readOnly || isEdit"
            label="Kode Kategori"
            value.bind="data.Code"
            error.bind="error.Code"
            read-only.bind="readOnly || isEdit"
            options.bind="controlOptions">
        </au-textbox>

        <au-textbox
            label="Nama Kategori"
            value.bind="data.Name"
            error.bind="error.Name"
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-textbox>

    </au-input-form>
</template>
