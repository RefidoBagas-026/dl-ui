<template>
    <h1 class="page-header">Monitoring Penggunaan PR Master</h1>
    <form class="form-horizontal">
        <au-autocomplete  
            value.bind="buyer" 
            label="Buyer"  
            text.bind="buyerView"
            loader.bind="buyerLoader"
            options.bind="controlOptions"
            placeholder="Cari Buyer"
            error.bind="error.buyer">
        </au-autocomplete>

        <au-autocomplete  
            value.bind="category" 
            label="Kategori"  
            loader.bind="categoryLoader"
            options.bind="controlOptions"
            error.bind="error.category"
            placeholder="Cari Kategori">
        </au-autocomplete>
        
        <au-textbox
            value.bind="article" 
            label="Artikel"
            options.bind="controlOptions"
            placeholder="input Artikel"  >
        </au-textbox>

        <div class="form-group">
            <label for="contact" class="col-sm-5 control-label"></label>
            <div class="col-sm-3">
                <button click.delegate="search()" class='btn btn-success'>Cari</button>
                <button click.delegate="reset()" class='btn btn-success'>Reset</button>
            </div>
        </div>
        <div class="btn-group pull-left">
            <a click.delegate="xls()" class='btn btn-primary'>Cetak Excel</a>
        </div>
        <table ref="table" class="table table-bordered table-hover" border="1" id="myTable"></table>

        <div class="alert alert-info text-center" role="alert" if.bind="data.length === 0">
            Tidak ada data.
        </div>
        <pagination if.bind="info.total>info.size" info.bind="info" change.delegate="changePage($event)" id="pager">
        </pagination>
        <hr />
        <hr />
    </form>
</template>
