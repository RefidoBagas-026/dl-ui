<template>
    <h1 class="page-header">Monitoring Status Ro Job</h1>
    <form class="form-horizontal">
        <au-datepicker label="Tanggal Awal" value.bind="dateFrom" options.bind="controlOptions"></au-datepicker>
        <au-datepicker label="Tanggal Akhir" value.bind="dateTo" options.bind="controlOptions"></au-datepicker>
        <div class="form-group">
            <label for="contact" class="col-sm-6 control-label"></label>
            <div class="col-sm-3">
                <button click.delegate="search()" class='btn btn-success' >Cari Data</button>
                <button click.delegate="reset()" class='btn btn-danger'>Reset Data</button>
            </div>
        </div>  
        <div slot="toolbar" class="btn-group">
            <button class='btn btn-primary' click.delegate="ExportToExcel()">Export To Excel</button>
          </div>
        <br>
        <table class="table table-bordered table-hover" id="myTable">
            <thead>
                 <tr>
                    <th class="text-center">No</th>
                    <th class="text-center">Section</th>
                    <th class="text-center">Section Name</th>
                    <th class="text-center">Dibuat Oleh</th>
                    <th class="text-center">Nomer RO</th>                    
                    <th class="text-center">Nama Brand</th>
                    <th class="text-center">Nama Buyer</th>
                    <th class="text-center">Turun RO</th>                    
                    <th class="text-center">Validasi MD</th>
                    <th class="text-center">Validasi QC</th>
                    <th class="text-center">Shipment</th>                    
                 </tr>
            </thead>
            <tbody>
                    <tr repeat.for="item of data">
                        <td class="text-center"> ${$index + 1}</td>
                        <td>${item.Section}</td>
                        <td>${item.SectionName}</td>
                        <td>${item.CreatedBy}</td>
                        <td>${item.RO_Number}</td>                    
                        <td>${item.BuyerBrand.Name}</td>
                        <td>${item.Buyer.Name}</td>
                        <td>${ formatDate(item.CreatedUtc) }</td>
                        <td>${ formatDate(item.ValidationMDDate) }</td>
                        <td>${ formatDate(item.ValidationSampleDate) }</td>
                        <td>${ formatDate(item.DeliveryDate) }</td>
                    </tr>
            </tbody>
        </table>
        <div class="alert alert-info text-center" role="alert" if.bind="data.length == 0">
            Tidak Ada Data Yang Ditemukan.
        </div>
        <pagination if.bind="info.total>info.size"  info.bind="info" change.delegate="changePage($event)"></pagination>
        <hr/>
    </form>

</template>
