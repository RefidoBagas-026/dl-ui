<template>
    <style>
        .tooltip-material-field {
            position: relative;
            display: inline-block;
        }
    
        .tooltip-material-field .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
    
            /* Position the tooltip */
            position: absolute;
            z-index: 1;
        }
    
        .tooltip-material-field:hover .tooltiptext {
            visibility: visible;
        }
    </style>
    
    <tr>
        <td>
            <au-textbox value.bind="data.MaterialIndex + 1" options.bind="controlOptions" read-only="true"></au-textbox>
        </td>
        <td if.bind="data.IsAddPRMaster">
            <button class="btn btn-primary" click.delegate="clickPRMaster()">+</button>
        </td>
        <td if.bind="!data.IsAddPRMaster">
            
        </td>
        <!-- FROM PR MASTER -->
        <!-- <template if.bind="!data.POMaster"> -->
            <!-- CMT -->
             <td>
                <div style="width: 100px;" class="tooltip-material-field">
                    <au-checkbox value.bind="data.isFabricCM" simbol.bind="true" read-only.bind="true" options.bind="controlOptions" ></au-checkbox>
                <span class="tooltiptext">CMT</span>
                </div>
            </td>
            <td>
            <div style="min-width: 50px;" class="tooltip-material-field">
                <au-textbox value.bind="data.POMaster" options.bind="controlOptions" read-only.bind="true">
                </au-textbox>
                <span class="tooltiptext">No. PO</span>
            </div>
        </td>
            <!-- kategori -->
             <td>
                <div style="width: 100px;" class="tooltip-material-field">
                    <au-textbox value.bind="data.Category.Name" error.bind="error.Category" options.bind="controlOptions" read-only.bind="true">
                    </au-textbox>
                    <span class="tooltiptext">Kategori Barang</span>
                    <div if.bind="data.Product.IsError && !error.Category" class="form-group has-error">
						<span if.bind="data.Product.IsError" class="help-block">
							${data.Product.ErrorMessage}
						</span>
					</div>
                </div>
            </td>
            
            <!-- kode barang -->
            <td>
                <div style="width: 100px;" class="tooltip-material-field">
                    <au-textbox value.bind="productCode" options.bind="controlOptions" read-only.bind="true">
                    </au-textbox>
                    <span class="tooltiptext">Kode Barang</span>
                </div>
            </td>
            <!-- komposisi -->
            <td>
                <div style="width: 200px;" class="tooltip-material-field">
                    <au-autocomplete value.bind="selectedComposition"  read-only.bind="true"  placeholder="Cari Komposisi" text="Composition" options.bind="controlOptions" loader.bind="garmentProductDistinctDescriptionLoader" show.bind="categoryIsExist" keypress.delegate="enterDelegate($event)">
                    </au-autocomplete>
                    <span class="tooltiptext">Komposisi</span>
                </div>
            </td>
            <!-- konstruksi -->
            <td>
                <div style="width: 100px;" class="tooltip-material-field">
                    <au-autocomplete query.bind="filterProductQuery"  read-only.bind="true" placeholder="Cari Konstruksi" text.bind="getConstructionText" value.bind="selectedConstruction" options.bind="controlOptions" loader.bind="garmentProductConstLoader" show.bind="compositionIsExist" keypress.delegate="enterDelegate($event)">
                    </au-autocomplete>
                    <span class="tooltiptext">Konstruksi</span>
                </div>
            </td>
            <!-- yarn -->
            <td>
                <div style="width: 100px;" class="tooltip-material-field">
                    <au-autocomplete query.bind="filterProductQuery"  read-only.bind="true" placeholder="Cari Yarn" text.bind="getYarnText" value.bind="selectedYarn" options.bind="controlOptions" loader.bind="garmentProductYarnLoader" show.bind="constructionIsExist" keypress.delegate="enterDelegate($event)">
                    </au-autocomplete>
                    <span class="tooltiptext">Yarn</span>
                </div>
            </td>
            <!-- width -->
            <td>
                <div style="width: 100px;" class="tooltip-material-field">
                    <au-autocomplete query.bind="filterProductQuery"  read-only.bind="true" placeholder="Cari Width" text.bind="getWidthText" value.bind="selectedWidth" options.bind="controlOptions" loader.bind="garmentProductWidthLoader" show.bind="yarnIsExist" keypress.delegate="enterDelegate($event)">
                    </au-autocomplete>
                    <span class="tooltiptext">Width</span>
                </div>
            </td>
            <!-- deskripsi -->
            <td>
                <div style="width: 200px;" class="tooltip-material-field">
                    <au-multiline placeholder="Deskripsi" value.bind="data.Description" error.bind="error.Description" options.bind="controlOptions"
                        show.bind="productCodeIsExist" read-only.bind="true"></au-multiline>
                    <span class="tooltiptext">Deskripsi</span>
                </div>
            </td>
        <!-- </template> -->
        <!-- detail barang -->
        <td>
            <div style="min-width: 200px;" class="tooltip-material-field">
                <au-multiline placeholder="Detail Barang" value.bind="data.ProductRemark" error.bind="error.ProductRemark" options.bind="controlOptions"
                    show.bind="productCodeIsExist" read-only.bind="true"></au-multiline>
                <span class="tooltiptext">Detail Barang</span>
            </div>
        </td>
        <!-- kuantitas -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="data.Quantity" error.bind="error.Quantity" format = "0,0.000" options.bind="controlOptions" show.bind="productCodeIsExist" read-only.bind="true"></au-numeric>
                <span class="tooltiptext">Kuantitas</span>
            </div>
        </td>
        <!-- satuan -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-autocomplete placeholder="Cari Satuan" value.bind="data.UOMQuantity" error.bind="error.UOMQuantity" loader.one-time="uomLoader"
                    options.bind="controlOptions" text.bind="uomView" show.bind="productCodeIsExist" read-only.bind="true" keypress.delegate="enterDelegate($event)">
                </au-autocomplete>
                <span class="tooltiptext">Satuan</span>
            </div>
        </td>
        <!-- price -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="data.Price" error.bind="error.Price" format = "0,0.00" options.bind="controlOptions" show.bind="productCodeIsExist" read-only.bind="true"></au-numeric>
                <span class="tooltiptext">Price</span>
            </div>
        </td>
        <!-- FROM PR MASTER -->
            <!-- satuan harga -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-autocomplete value.bind="data.UOMPrice" options.bind="controlOptions" text.bind="uomView" read-only="true"></au-autocomplete>
                <span class="tooltiptext">Satuan Harga</span>
            </div>
        </td>
        <!-- INPUT MANUAL -->
        <!-- konversi -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="data.Conversion" error.bind="error.Conversion" options.bind="controlOptions" show.bind="productCodeIsExist" read-only.bind="true" format="0,0.[00000000000000000000]"></au-numeric>
                <span class="tooltiptext">Konversi</span>
            </div>
        </td>
        <!-- total -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="total" read-only.bind="true"  format = "0,0.00" ></au-numeric>
                <span class="tooltiptext">Total</span>
            </div>
        </td>
        <!-- ongkir -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="data.ShippingFeePortion" error.bind="error.ShippingFeePortion" options.bind="controlOptions" show.bind="productCodeIsExist" read-only.bind="true"></au-numeric>
                <span class="tooltiptext">Ongkir (%)</span>
            </div>
        </td>
        <!-- jumlah ongkir -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="totalShippingFee" read-only.bind="true"></au-numeric>
                <span class="tooltiptext">Jumlah Ongkir</span>
            </div>
        </td>
        <!-- kuantitas budget -->
        <td>
            <div style="width: 100px;" class="tooltip-material-field">
                <au-numeric value.bind="budgetQuantity" error.bind="error.BudgetQuantity" read-only.bind="true"></au-numeric>
                <span class="tooltiptext">Kuantitas Budget</span>
            </div>
        </td>
        <!-- <td if.bind="!readOnly">
            <button class="btn btn-danger pull-right" click.delegate="onremove(data, $event)">-</button>
        </td> -->
    </tr>
</template>
