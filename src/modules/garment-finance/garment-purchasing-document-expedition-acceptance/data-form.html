<template>
    <au-input-form title.bind="title" with.bind="context">
        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)" if.one-way="context.hasCancel">Kembali</button>
            <button class="btn btn-primary" click.delegate="context.edit($event)" if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)" if.one-way="context.hasSave">Simpan</button>
            <button class="btn btn-danger" click.delegate="context.delete($event)" if.one-way="context.hasDelete">Hapus</button>
        </div>

        <au-textbox label="No. Nota Intern" value.bind="data.inNo" read-only.bind="true" if.bind="readOnly || isEdit"
            options.bind="auInputOptions">
        </au-textbox>

        <au-textbox label="No. Invoice" value.bind="data.invoiceNo" read-only.bind="true" if.bind="readOnly || isEdit"
            options.bind="auInputOptions">
        </au-textbox>

        <au-textbox label="Supplier" value.bind="data.supplierName" read-only.bind="true" if.bind="readOnly || isEdit"
            options.bind="auInputOptions">
        </au-textbox>

        <au-collection items.bind="data.items" options.bind="options" columns.bind="internNoteRevisionItem.columns"
            errors.bind="error.items" read-only.bind="readOnly" view-model.ref="ItemsCollection"
            item-template="modules/garment-finance/garment-purchasing-document-expedition-acceptance/template/intern-note-revision-item">
        </au-collection>
    </au-input-form>
</template>
