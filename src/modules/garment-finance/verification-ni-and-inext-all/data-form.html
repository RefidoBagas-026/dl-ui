<template>
    <au-input-form title.bind="title" with.bind="context">
        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)">Kembali</button>
            <button class="btn btn-success" click.delegate="context.approve($event)" if.one-way="context.hasApproval">Approve</button>
            <button class="btn btn-danger" click.delegate="context.reject($event)" if.one-way="context.hasApproval">Reject</button>
        </div>

        <au-comparison 
            label="Nomor Invoice" 
            value1.bind="data.invoiceNo" 
            value2.bind="data.invoiceNoScanResult" 
            label1="Data DMS" 
            label2="Data Hasil Scan"
            use-custom-different-function.bind="true"
            is-different-result.bind="data.invoiceIsMatch">
        </au-comparison>

        <au-comparison 
          label="Total Amount" 
          value1.bind="data.totalAmountAfterTax" 
          value2.bind="data.totalAmountAfterTaxScanResult" 
          label1="Data DMS" 
          label2="Data Hasil Scan" 
          format="0.00"
          use-custom-different-function.bind="true"
          is-different-result.bind="data.totalAmountAfterTaxIsMatch">
        </au-comparison>

        <au-comparison 
          label="Total PPN" 
          value1.bind="data.totalVat" 
          value2.bind="data.totalVatScanResult" 
          label1="Data DMS" 
          label2="Data Hasil Scan" 
          format="0.00"
          highlight-differences.bind="highlightDifferencesTax"
          remark.bind="taxComparisonRemark"
          remark-type.bind="taxRemarkType"
          use-custom-different-function.bind="true"
          is-different-result.bind="data.totalVatIsMatch">
        </au-comparison>

        <au-collection items.bind="data.items" columns.bind="itemsInfoReadOnly.columnsReadOnly" show.bind="data.items.length > 0"
            read-only.bind="true"  
            item-template="modules/garment-finance/verification-ni-and-inext-all/template/external-invoice-revision-item">
        </au-collection>

        <au-collection items.bind="data.deliveryOrders" columns.bind="deliveryOrdersInfoReadOnly" show.bind="data.deliveryOrders.length > 0"
            read-only.bind="true"  
            item-template="modules/garment-finance/verification-ni-and-inext-all/template/external-invoice-revision-delivery-order">
        </au-collection>

        <au-textbox label="Keterangan" read-only="true" value.bind="descriptionData" options.bind="auInputOptions">
        </au-textbox>

        <au-textbox read-only="true" if.bind="hasAdditionalDescription" value.bind="data.additionalDescription" options.bind="auInputOptions">
        </au-textbox>

        <au-textbox label="Keterangan Reject" read-only="true" value.bind="data.approvalDescription" options.bind="auInputOptions" if.bind="isRejected">
        </au-textbox>

    </au-input-form>
</template>
