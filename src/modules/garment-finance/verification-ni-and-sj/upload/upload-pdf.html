<template>
  <form>
    <div class="form-group">
      <label for="pdf-upload">Upload PDF</label>
      <input id="pdf-upload" type="file" accept="application/pdf" class="form-control" ref="fileInput" change.delegate="onFileChange($event)">
      <span if.bind="uploadError" class="text-danger">${uploadError}</span>
    </div>
    <div class="form-group">
      <button class="btn btn-primary" type="button" click.delegate="uploadFile()" disabled.bind="uploading">
        ${uploading ? 'Uploading...' : 'Upload'}
      </button>
      <button class="btn btn-secondary" type="button" click.delegate="clearFile()" disabled.bind="uploading">
        Clear
      </button>
    </div>
    <div if.bind="file">
      <strong>Selected file:</strong> ${file.name}
    </div>
  </form>
</template>
