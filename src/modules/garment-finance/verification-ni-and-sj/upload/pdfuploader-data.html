<template>
  <require from="../css/pdfuploader-data.css"></require>
  <div class="pdfuploader-data-container">
    <div if.bind="!documents || documents.length === 0" class="pdfuploader-data-empty">Belum Ada Data Scanner</div>
    <div repeat.for="doc of documents">
      <au-table
        data.bind="getDocLoader(doc)"
        columns.bind="tableColumns"
        options.bind="tableOptions"
        page-size="1">
      </au-table>
      <!-- Child/detail row akan di-inject dari JS (detailFormatter) -->
    </div>
  </div>
</template>
