<template>
    <au-input-form title.bind="title" with.bind="context" options.bind="formOptions">

        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)"
                if.one-way="context.hasCancel">Kembali</button>
            <button class="btn btn-primary" click.delegate="context.edit($event)"
                if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)"
                if.one-way="context.hasSave">Simpan</button>
            <button class="btn btn-danger" click.delegate="context.delete($event)"
                if.one-way="context.hasDelete">Hapus</button>
        </div>

        <au-textbox error.bind="error.DONo" value.bind="DONo" label="No Surat Jalan" read-only.bind="readOnly"
            options.bind="controlOptions" textstyle="upper-case">
        </au-textbox>
        <!-- 
        <au-textbox
            value.bind="data.DONo"
            error.bind="error.DONo"
            label="No Surat Jalan"
            read-only.bind="readOnly"
            textstyle="upper-case"
            options.bind="controlOptions">
        </au-textbox>
         -->
        <au-autocomplete value.bind="selectedSupplier" error.bind="error.Supplier" label="Supplier"
            loader.bind="supplierLoader" text.bind="supplierView" placeholder="Supplier" read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-datepicker label="Tanggal SJ" value.bind="data.DODate" error.bind="error.DODate" read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-datepicker>

        <div class="form-group has-error">
            <p if.bind="error.itemscount" class="help-block text-center">${error.itemscount}</p>
        </div>

        <au-collection 
                items.bind="data.items" 
                errors.bind="error.Items" 
                columns.bind="ItemsColumns"
                read-only.bind="readOnly" 
                add.bind="addItems" 
                remove.bind="removeItems"
                options.bind="Options"
                item-template="modules/inventory/transit-warehouse/transit-warehouse-in/templates/item">
        </au-collection>

    </au-input-form>
    <div class="row"></div>
</template>
