<template>
    <au-input-form
        title.bind="title"
        with.bind="context"
        options.bind="formOptions">

        <div slot="actions" class="btn-group">
            <button class="btn btn-default" click.delegate="context.cancel($event)" if.one-way="context.hasCancel">Kembali</button>
            <button class="btn btn-primary" click.delegate="context.edit($event)" if.one-way="context.hasEdit">Ubah</button>
            <button class="btn btn-success" click.delegate="context.save($event)" if.one-way="context.hasSave">Simpan</button>
            <button class="btn btn-danger" click.delegate="context.delete($event)" if.one-way="context.hasDelete">Hapus</button>
        </div>

        <au-autocomplete
            value.bind="selectedDONo"
            error.bind="error.DONo"
            label="No Surat Jalan"
            loader.bind="doNoLoader"
            text="DONo"
            query.bind="doNoQuery"
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-autocomplete>
        
        <au-autocomplete
            value.bind="data.Supplier"
            error.bind="error.Supplier"
            label="Supplier"
            loader.bind="supplierLoader"
            text.bind="supplierView"
            placeholder="Supplier"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-datepicker 
            label="Tanggal SJ"
            value.bind="data.DODate"
            error.bind="error.DODate"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-datepicker>

        <au-numeric
            value.bind="data.RemainingQty"
            error.bind="error.RemainingQty"
            label="Sisa Quantity"
            format="0.00"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-numeric>

        <au-autocomplete
            value.bind="data.Uom"
            error.bind="error.Uom"
            label="Satuan"
            loader.bind="UomLoader"
            text="Unit"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-autocomplete>

        <au-textbox 
            label="Yang Mengambil" 
            value.bind="data.PickUpName" error.bind="error.PickUpName"
            read-only.bind="readOnly" options.bind="controlOptions">
        </au-textbox>

        <au-textbox 
            label="Bagian" 
            value.bind="data.Section" error.bind="error.Section"
            read-only.bind="readOnly" options.bind="controlOptions">
        </au-textbox>

        <au-datepicker 
            label="Tanggal Ambil"
            value.bind="data.PickUpDate"
            error.bind="error.PickUpDate"
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-datepicker>
        
        <au-numeric
            value.bind="data.Quantity"
            error.bind="error.Quantity"
            label="Quantity"
            format="0.00"
            read-only.bind="readOnly"
            options.bind="controlOptions">
        </au-numeric>
        
        <au-autocomplete
            value.bind="data.Uom"
            error.bind="error.Uom"
            label="Satuan"
            loader.bind="UomLoader"
            text="Unit"
            read-only.bind="true"
            options.bind="controlOptions">
        </au-autocomplete>
    </au-input-form>
    <div class="row"></div>
</template>
