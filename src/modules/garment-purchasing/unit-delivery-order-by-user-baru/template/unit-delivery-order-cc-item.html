<template >
    <tr>
        <td>
            <au-checkbox 
                value.bind="data.IsSave" 
                disabled.bind="readOnly"
                change.delegate="changeCheckBox()">
            </au-checkbox>
        </td>
        <td>
            <au-textbox
                value.bind="data.ProductCode"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox
                value.bind="data.ProductName"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox
                value.bind="data.Composition"
                read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Yarn"
                read-only.bind="true" 
                options.bind="controlOptions">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Width"
                read-only.bind="true" 
                options.bind="controlOptions">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Description"
                read-only.bind="true" 
                options.bind="controlOptions">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.ProductRemark"
                read-only.bind="true" 
                options.bind="controlOptions">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.QuantityRO"
                read-only.bind="true" 
                options.bind="controlOptions">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.UomRO"
                read-only.bind="true" 
                options.bind="controlOptions">
            </au-textbox>
        </td>

        <td>
            <au-numeric 
                value.bind="data.Quantity"
                error.bind = "error.Quantity"
                read-only.bind="readOnly" 
                options.bind="controlOptions"
                change.delegate="data.DefaultDOQuantity = $event.target.value">
            </au-numeric>                    
        </td>

        <td if.bind="!readOnly">
            <au-autocomplete 
                value.bind="uomUnit" 
                error.bind="error.UomUnit"
                loader.bind="uomLoader"
                text.bind="uomView"
                placeholder="cari satuan" 
                key="Unit"
                read-only.bind="readOnly"
                options.bind="controlOptions">
            </au-autocomplete>                 
        </td>
        <td if.bind="readOnly">
            <au-textbox 
                value.bind="data.UomUnit"
                read-only.bind="true"
                options.bind="controlOptions">
            </au-textbox>
        </td>
    </tr>
</template>
