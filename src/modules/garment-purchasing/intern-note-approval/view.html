<template>
  <require from="../../../lib/number-format-value-converter.js"></require>
  <require from="../../../lib/date-format-value-converter.js"></require>

  <au-input-form 
      title.bind="title" 
      with.bind="context" 
      options.bind="formOptions" 
      edit.call="editCallback($event)" 
      delete.call="deleteCallback($event)">
    
    <div class="row">
      <div class="col-md-6">
        <au-textbox label="No. Nota Intern" value.bind="data.inNo" error.bind="error.no" read-only.bind="true" if.bind="readOnly || isEdit"
            options.bind="controlOptions">
        </au-textbox>

        <au-datepicker label="Tgl. Nota Intern" value.bind="data.inDate" error.bind="error.date" read-only.bind="true" if.bind="(readOnly || isEdit)"
            options.bind="controlOptions">
        </au-datepicker>

        <au-textbox value.bind="data.currency.Code" error.bind="error.currency" label="Mata Uang"
            placeholder="cari mata uang" read-only.bind="readOnly" options.bind="controlOptions">
        </au-textbox>

        <au-textbox value.bind="data.supplier.Name" error.bind="error.supplier" label="Supplier"
            placeholder="cari supplier" read-only.bind="readOnly" options.bind="controlOptions">
        </au-textbox>

        <au-multiline label="Keterangan" value.bind="data.remark" error.bind="error.remark" read-only.bind="readOnly" placeholder="tambah keterangan"
            options.bind="controlOptions">
        </au-multiline>

        <au-textbox 
                    label="Admin Pembelian" 
                    value.bind="data.CreatedBy" 
                    error.bind="error.CreatedBy" 
                    read-only.bind="true"
                    if.bind="(readOnly || isEdit)"
                    options.bind="controlOptions">
        </au-textbox>

        <au-multiline label="Alasan Keterlambatan" 
            value.bind="data.lateReason" 
            error.bind="error.lateReason" 
            read-only.bind="readOnly" 
            show.bind="data.isLate" 
            options.bind="controlOptions">
        </au-multiline>
      </div>
    </div>

    <br>
    <h4>Daftar Item</h4>
    <au-collection 
        items.bind="data.items" 
        columns.bind="itemsInfo.columns"
        options.bind="itemsInfo.options"
        read-only.bind="readOnly"
        item-template="modules/garment-purchasing/intern-note-approval/template/intern-note-item"
        footer-template = "modules/garment-purchasing/intern-note-approval/template/intern-note-item-footer">
    </au-collection>
    
  </au-input-form>
</template>
