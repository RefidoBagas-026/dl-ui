<template>
  <style>
    .checkbox-disabled {
      pointer-events: none;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
  <require from="./_layout"></require>
  <au-layout options.bind="options" label.bind="label" error.bind="error"> 
    <div class="checkbox" if.bind="!readOnly && !simbol">
      <label>
        <input type="checkbox" checked.bind="value" disabled.bind="disabled">
      </label>
    </div>

    <!-- 2. Checkbox SIMBOL (biru & tidak bisa klik) -->
    <div class="checkbox checkbox-disabled" if.bind="simbol">
      <label>
        <input type="checkbox" checked.bind="value">
      </label>
    </div>
    <p class="form-control-static" if.bind="readOnly && !simbol">${value ? "Ya" : "Tidak"}</p>
  </au-layout>
</template>
