<!-- EXAMPLES OF HOW TO USE THE COMPARISON COMPONENTS -->

<!-- Basic comparison (read-only) -->
<au-comparison 
  label="Invoice Number" 
  value1.bind="data.invoiceNo" 
  value2.bind="data.invoiceNo2" 
  label1="System Data" 
  label2="Uploaded Data">
</au-comparison>

<!-- With custom labels -->
<au-comparison 
  label="Invoice Date" 
  value1.bind="data.invoiceDate" 
  value2.bind="data.invoiceDate2" 
  label1="Database" 
  label2="Excel File" 
  format="date">
</au-comparison>

<!-- With numeric formatting -->
<au-comparison 
  label="Total Amount" 
  value1.bind="data.totalAmount" 
  value2.bind="data.totalAmount2" 
  label1="Calculated" 
  label2="Manual Entry" 
  format="0.00">
</au-comparison>

<!-- Editable comparison -->
<au-comparison-editable 
  label="Tax Number" 
  value1.bind="data.taxNumber" 
  value2.bind="data.taxNumber2" 
  label1="System" 
  label2="Manual Input" 
  read-only1="true" 
  read-only2="false"
  placeholder2="Enter tax number...">
</au-comparison-editable>

<!-- Without difference highlighting -->
<au-comparison 
  label="Currency" 
  value1.bind="data.currency" 
  value2.bind="data.currency2" 
  label1="Default" 
  label2="Override" 
  highlight-differences="false">
</au-comparison>
